use_case: fetch
dependencies:
  # - apets-ariel[fetch] @ git+https://github.com/kgd-al/apets-ariel
  - -e apets-ariel[fetch] @ file:///home/kgd/work/code/vu/apets-ariel
  - git+https://github.com/kgd-al/ariel

environment:
  name: ARIEL - Fetch
  description: "Play with an artificial pet"
  filepaths:
    environment: environment.py

agents:
  - role: fetch_agent
    name: Fetcher
    description: ""
    policy: null
    participant: true
    keyboard_inputs:
      ArrowRight: 1
      ArrowUp: 2
      ArrowLeft: 3
      ArrowDown: 4
      default: 0
    keyboard_input_display:
      ArrowLeft:
        symbol: "\u2190"
        label: Left
      ArrowUp:
        symbol: "\u2191"
        label: Up
      ArrowRight:
        symbol: "\u2192"
        label: Right
      ArrowDown:
        symbol: "\u2193"
        label: Down
    multiple_keyboard_inputs: true
    inputs_type: actions
    textual_inputs: false

experiment:
  link: fetch
  name: Fetch
  short_description: Testing fetch task
  long_description: |
    Control stuff in the fetch task
  enabled: true
  number_of_episodes: 1
  target_fps: 24.0
  wait_for_inputs: false
